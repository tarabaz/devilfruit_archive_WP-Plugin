<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Archivio / Griglia Esemplari</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dfa-archive">
  <div class="dfa-archive__scanlines" aria-hidden="true"></div>

  <header class="dfa-archive__header">
    <div class="dfa-archive__title dfa-display">VEGAPUNK RESEARCH DIVISION</div>
    <div class="dfa-archive__subtitle">— DEVIL FRUIT ARCHIVE —</div>
    <div class="dfa-archive__tag">CLASSIFIED SPECIMENS</div>
    <div class="dfa-archive__rule"></div>
    <div class="dfa-archive__brandbar">
      <div style="display:flex;gap:34px">
        <span>CATALOGO</span><span>TIPOLOGIE</span><span>ARCHIVIO</span><span>CONTATTI</span>
      </div>
      <div>FRANCYSTORE3D</div>
    </div>
  </header>

  <div class="dfa-archive__grid">

    <!-- card ripetuta per ogni esemplare (post CPT "esemplare") -->
    <article class="dfa-archive__card">
      <span class="dfa-archive__card-corner dfa-archive__card-corner--tl"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--tr"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--bl"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--br"></span>

      <div class="dfa-archive__card-image">
        <img src="reference-assets/Senza titolo-1.png" alt="">
      </div>
      <div class="dfa-archive__card-id">DF-001</div>
      <div class="dfa-archive__card-name dfa-display">GOMU GOMU NO MI</div>
      <div class="dfa-archive__badge">
        <span class="dfa-archive__badge-icon"></span>
        <span>PARAMECIA</span>
      </div>
    </article>

    <article class="dfa-archive__card">
      <span class="dfa-archive__card-corner dfa-archive__card-corner--tl"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--tr"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--bl"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--br"></span>

      <div class="dfa-archive__card-image">
        <img src="reference-assets/Senza titolo-1.png" alt="">
      </div>
      <div class="dfa-archive__card-id">DF-002</div>
      <div class="dfa-archive__card-name dfa-display">MERA MERA NO MI</div>
      <div class="dfa-archive__badge">
        <span class="dfa-archive__badge-icon dfa-archive__badge-icon--logia"></span>
        <span>LOGIA</span>
      </div>
    </article>

    <article class="dfa-archive__card">
      <span class="dfa-archive__card-corner dfa-archive__card-corner--tl"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--tr"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--bl"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--br"></span>

      <div class="dfa-archive__card-image">
        <img src="reference-assets/Senza titolo-1.png" alt="">
      </div>
      <div class="dfa-archive__card-id">DF-003</div>
      <div class="dfa-archive__card-name dfa-display">HITO HITO NO MI</div>
      <div class="dfa-archive__badge">
        <span class="dfa-archive__badge-icon dfa-archive__badge-icon--zoan"></span>
        <span>ZOAN</span>
      </div>
    </article>

    <article class="dfa-archive__card">
      <span class="dfa-archive__card-corner dfa-archive__card-corner--tl"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--tr"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--bl"></span>
      <span class="dfa-archive__card-corner dfa-archive__card-corner--br"></span>

      <div class="dfa-archive__card-image">
        <img src="reference-assets/Senza titolo-1.png" alt="">
      </div>
      <div class="dfa-archive__card-id">DF-004</div>
      <div class="dfa-archive__card-name dfa-display">TORI TORI NO MI</div>
      <div class="dfa-archive__badge">
        <span class="dfa-archive__badge-icon dfa-archive__badge-icon--mythical"></span>
        <span>ZOAN (MYTHICAL)</span>
      </div>
    </article>

  </div>
</div>

</body>
</html>
